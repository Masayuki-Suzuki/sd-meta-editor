# リリースワークフローの雛形。**現在このワークフローは使用しない。**
#
# ADR-0009 により、3 OS すべてをそれぞれの実機でローカルビルドする方針に決まった。
#
#   macOS (Apple Silicon)  -> 開発機の Mac
#   Windows 11             -> Windows 実機
#   Ubuntu 24.04 (x86_64)  -> Ubuntu 実機
#
# GitHub Actions を使わない理由は ADR-0007（CI の廃止）を参照。
# Windows / Linux のジョブを含めていないのは、実機ビルドに移したためである。
#
# app/ の Tauri スキャフォールドが入るまでは中身も未完成。
# このワークフロー自体の削除は ADR-0009 の Consequences のとおり別途判断する。
name: Release

on:
  workflow_dispatch:

jobs:
  macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # TODO: app/ のスキャフォールド後に frontend のセットアップと
      #       tauri-apps/tauri-action によるビルドを追加する。
      #       ターゲットは aarch64-apple-darwin 単体（ADR-0008 C-7′）。
      - name: Placeholder
        run: echo "Tauri app has not been scaffolded yet (see docs/requirements.md section 8)."
