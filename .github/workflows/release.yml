# リリースワークフローの雛形。
#
# ADR-0007 により、当面このワークフローは使用しない。
# macOS 向けビルドはローカル（開発機の Mac）で行う方針で、
# GitHub Actions の macOS ランナーは分数倍率 10 倍のため常用しない。
#
# Windows / Linux のジョブは意図的に含めていない。
# Windows は Windows 実機でのビルド、Linux は Linux コンテナでの
# ビルドを想定している（いずれも ADR-0007 を参照）。
#
# app/ の Tauri スキャフォールドが入るまでは中身も未完成。
name: Release

on:
  workflow_dispatch:

jobs:
  macos:
    name: Build (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # TODO: app/ のスキャフォールド後に frontend のセットアップと
      #       tauri-apps/tauri-action によるビルドを追加する。
      #       ターゲットは universal-apple-darwin（ADR-0001）。
      - name: Placeholder
        run: echo "Tauri app has not been scaffolded yet (see docs/requirements.md section 8)."
