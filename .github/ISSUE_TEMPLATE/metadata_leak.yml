name: 消し残し報告
description: 削除したはずのメタデータが残っていた場合
labels: ["security", "leak"]
body:
  - type: markdown
    attributes:
      value: |
        **これは通常のバグより優先度が高い報告です。**
        本ツールの中核的な約束は「確実に消えること」です。

  - type: input
    id: generator
    attributes:
      label: 画像の生成元ツール
    validations:
      required: true

  - type: textarea
    id: leftover
    attributes:
      label: 残っていたデータの場所と内容
      description: "例: PNG の zTXt チャンクに parameters が残っていた"
    validations:
      required: true

  - type: textarea
    id: how-found
    attributes:
      label: どうやって気づいたか
      description: 使用した確認ツール（exiftool など）とそのコマンド

  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 貼り付ける内容から、公開したくない情報を除去しました
          required: true
